<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="admin-auth.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12091f">
  <title>Add Game Results — BAGASS Admin</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="admin-header">
    <p class="eyebrow">BAGASS Admin</p>
    <h1>Add Game Results</h1>
  </header>

  <main class="admin-main section-shell">
    <section class="admin-card admin-card--wide">
      <h2>Session Details</h2>
      <form id="resultsForm" class="admin-form">
        <label for="gameSelect">Game</label>
        <select id="gameSelect">
          <option value="">Loading games…</option>
        </select>

        <label for="seasonSelect">Season</label>
        <select id="seasonSelect">
          <option value="">Loading seasons…</option>
        </select>

        <label for="moment">Moment of the Night</label>
        <input type="text" id="moment" name="moment" placeholder="e.g. Jake held his nerve to claim victory">

        <label for="notesEditor">Notes</label>
        <div class="html-editor">
          <div class="html-editor-toolbar" role="toolbar" aria-label="Notes formatting">
            <button type="button" data-command="bold" title="Bold"><b>B</b></button>
            <button type="button" data-command="italic" title="Italic"><i>I</i></button>
            <button type="button" data-command="underline" title="Underline"><u>U</u></button>
            <button type="button" data-command="insertUnorderedList" title="Bullet list">•&nbsp;List</button>
            <button type="button" data-command="insertOrderedList" title="Numbered list">1.&nbsp;List</button>
            <button type="button" data-command="formatBlock" data-value="blockquote" title="Quote">❝</button>
            <button type="button" data-command="removeFormat" title="Clear formatting">Clear</button>
          </div>
          <div id="notesEditor" class="html-editor-surface" contenteditable="true" data-placeholder="Write the session notes…"></div>
        </div>

        <label>Player Results</label>
        <div class="results-header">
          <span>Player</span>
          <span>Position</span>
          <span>Points</span>
          <span></span>
        </div>
        <div id="resultsRepeater" class="results-repeater"></div>
        <button type="button" id="addResultRow" class="secondary-button">+ Add Player</button>

        <button class="primary-button" type="submit">Save Results</button>
        <p id="resultsError" class="admin-error" hidden></p>
        <p id="resultsSuccess" class="admin-success" hidden></p>
      </form>
    </section>
  </main>

  <footer><a href="index.html">Back to admin actions</a></footer>

  <script src="add-results.js"></script>
</body>
</html>
